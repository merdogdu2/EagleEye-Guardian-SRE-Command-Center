# Gemini Enterprise side-panel Canvas iframe server configuration.
# Note: X-Frame-Options is intentionally omitted so Gemini Enterprise can embed the Canvas iframe.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.google.com https://*.cloud.google.com https://*.googleusercontent.com;" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
