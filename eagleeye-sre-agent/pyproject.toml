[project]
name = "eagleeye-sre-agent"
version = "0.1.0"
description = "EagleEye Guardian: Autonomous SRE & Cloud Operations Multi-Agent System on Google Cloud Gemini Enterprise (ADK + A2UI v0.9)"
readme = "../README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "google-adk[a2a]>=1.16.0",
    "google-cloud-agentplatform[agent-engines]>=2.2.0",
    "google-genai>=1.40.0",
    "pydantic>=2.10.0",
    "fastapi>=0.115.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
